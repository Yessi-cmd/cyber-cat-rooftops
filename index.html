<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17162f" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="https://game.norliva.top/" />
    <meta
      name="description"
      content="一只小猫在温暖的赛博城市楼顶间跳跃。轻触屏幕，别掉下去！"
    />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:url" content="https://game.norliva.top/" />
    <meta property="og:title" content="赛博小猫跳楼顶" />
    <meta
      property="og:description"
      content="轻触屏幕，让围巾小猫跃过温暖的赛博城市楼顶。"
    />
    <meta property="og:image" content="https://game.norliva.top/og-card.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="橘白小猫戴着珊瑚围巾跃过温暖的夜间城市楼顶" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://game.norliva.top/og-card.jpg" />
    <title>今日随记 · 小憩</title>
  </head>
  <body>
    <main class="page-shell">
      <article class="document">
        <header class="document-header">
          <span class="document-category" data-document="category">个人工作区 / 随记</span>
          <span class="document-tag" data-document="tag">仅本地</span>
        </header>
        <div class="document-intro">
          <p class="document-kicker" data-document="kicker">DAILY NOTES</p>
          <h2 data-document="title">今日随记</h2>
          <p data-document="intro">留一点空白，换个思路。</p>
        </div>
        <div class="section-label"><span data-document="section">01 / 片刻小憩</span><span data-document="hint">随时暂停</span></div>
      <section id="game-shell" class="game-shell" tabindex="0" aria-label="赛博小猫跳楼顶游戏区域">
        <canvas id="game-canvas" aria-label="游戏画面"></canvas>

        <div class="hud">
          <div class="score-group">
            <span class="score-row">
              <span id="score" aria-label="当前分数">0000</span>
              <span id="combo-count" aria-label="当前连击" hidden></span>
            </span>
            <span id="jump-count" class="sr-only" aria-label="剩余跳跃次数">可跳 2/2</span>
            <span id="loot-count" aria-label="收集鱼干数量">鱼干 × 0</span>
            <span id="power-list" class="power-list" aria-label="生效中的能力"></span>
          </div>
          <div class="hud-controls">
            <button id="sound-button" class="icon-button" type="button" aria-label="静音"></button>
            <button id="pause-button" class="icon-button" type="button" aria-label="暂停游戏"></button>
          </div>
        </div>

        <ol id="race-board" class="race-board" aria-label="实时排名" hidden></ol>
        <p id="hazard-status" role="status" aria-live="polite"></p>
        <p id="banner" class="banner" aria-hidden="true" hidden></p>

        <div id="overlay" class="overlay">
          <div class="panel">
            <div class="brand-lockup" aria-hidden="true">
              <img class="brand-mark" src="/favicon.svg" width="40" height="40" alt="" />
              <p id="eyebrow" class="eyebrow" data-document="brand">BREAK TIME</p>
            </div>
            <h1 id="overlay-title">赛博小猫跳楼顶</h1>
            <p id="overlay-copy">按住跳得高，轻点是小跳；空中再按一次二段跳。吃到楼间鱼干可叠连击，跳起来抢屋顶上的超能力道具；矮挡板轻跳、高信号塔跳满、低飞的鹰别跳。</p>
            <p id="result" class="result" hidden></p>
            <ol id="race-players" class="race-players" hidden></ol>
            <div id="race-invite" class="race-invite" hidden>
              <input id="race-link" class="race-link" type="text" readonly aria-label="邀请链接" />
              <button id="race-copy" class="secondary-button" type="button">复制邀请链接</button>
            </div>
            <button id="primary-button" class="primary-button" type="button">开始跳跃</button>
            <button id="secondary-button" class="secondary-button" type="button" hidden>邀请好友竞速</button>
          </div>
        </div>

        <div id="rotate-hint" class="rotate-hint">竖屏体验更顺手</div>
        <p id="live-status" class="sr-only" aria-live="polite"></p>
      </section>

      <p class="desktop-help">空格 / ↑ / W 跳跃（按住更高）· 空中再按二段跳 · P / Esc 暂停</p>
      <footer class="document-footer" data-document="footer">不必赶进度，准备好了再继续。</footer>
      </article>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
